[general]
os=auto
always_on_top=1

window_color=33,33,33,0.96
window_rounding=10
frame_rounding=6
window_padding=6,6

use_border=1
border_color=33,33,33,0.96
window_position=100,100
window_size=170,42

font=Inter Variable
font_size=12

button_order=I1,I2,48V,DIR
button_48V=1
button_DIR=1
button_I1=1
button_I2=0

[linux]
phantom_on=mf-cli 48v on
phantom_off=mf-cli 48v off

direct_on=mf-cli monitor on
direct_off=mf-cli monitor off

inst1_on=mf-cli inst on
inst1_off=mf-cli inst off

inst2_on=mf-cli inst on
inst2_off=mf-cli inst off


[windows]
python=C:\Python314\python.exe
script=D:\Tools\minifuse-cli\main.py

phantom_on="%python%" "%script%" power on
phantom_off="%python%" "%script%" power off

direct_on="%python%" "%script%" mono on
direct_off="%python%" "%script%" mono off

inst1_on="%python%" "%script%" inst on 1
inst1_off="%python%" "%script%" inst off 1

inst2_on="%python%" "%script%" inst on 2
inst2_off="%python%" "%script%" inst off 2
